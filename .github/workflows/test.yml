name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  craft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    env:
      CRAFT_TEST_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6
      - name: Build PHP test image
        run: docker build --build-arg PHP_VERSION="$CRAFT_TEST_PHP" -t visibility-craft-tests:php${CRAFT_TEST_PHP//./} -f tests/Dockerfile .
      - name: Install locked dependencies
        run: docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" visibility-craft-tests:php${CRAFT_TEST_PHP//./} composer --no-plugins install --no-interaction --no-progress
      - name: Validate package
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" visibility-craft-tests:php${CRAFT_TEST_PHP//./} composer --no-plugins validate --strict
      - name: Offline message and settings tests
        run: docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/app" visibility-craft-tests:php${CRAFT_TEST_PHP//./} php vendor/bin/phpunit --bootstrap tests/bootstrap.php tests
      - name: Installed Craft smoke test
        run: python3 tests/docker-smoke.py
